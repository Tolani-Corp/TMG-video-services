name: TMG Intake Control Plane Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: tmg-intake-control-plane-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d20586cf099d39fcbeb5db4043e20f6f
      D1_NAME: tmg-video-control-dev
      CONSOLE_HOST: console.tolanimediagroup.com
      BOOTSTRAP_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare credential contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 2; }

      - name: Discover or create D1 control database
        id: d1
        shell: bash
        run: |
          set -u
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          HTTP_CODE="$(curl --silent --show-error -o d1-list.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${API}?name=${D1_NAME}&per_page=100")"

          AUTHORIZED=false
          CREATED=false
          DB_ID=""
          if [ "${HTTP_CODE}" = "200" ]; then
            AUTHORIZED=true
            DB_ID="$(node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync("d1-list.json","utf8"));
              const row=(j.result||[]).find((x)=>x.name===process.env.D1_NAME);
              if(row?.uuid) process.stdout.write(row.uuid);
            ')"
            if [ -z "${DB_ID}" ]; then
              CREATE_CODE="$(curl --silent --show-error -o d1-create.json -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "${API}" \
                --data "{\"name\":\"${D1_NAME}\",\"primary_location_hint\":\"enam\",\"read_replication\":{\"mode\":\"disabled\"}}")"
              if [ "${CREATE_CODE}" = "200" ]; then
                DB_ID="$(node -e '
                  const fs=require("fs");
                  const j=JSON.parse(fs.readFileSync("d1-create.json","utf8"));
                  if(j.success && j.result?.uuid) process.stdout.write(j.result.uuid);
                ')"
                CREATED=true
              else
                AUTHORIZED=false
              fi
            fi
          fi

          echo "authorized=${AUTHORIZED}" >> "$GITHUB_OUTPUT"
          echo "database_id=${DB_ID}" >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}" >> "$GITHUB_OUTPUT"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          if [ "${AUTHORIZED}" != "true" ]; then
            echo "::warning::D1 control-plane access unavailable (HTTP ${HTTP_CODE}); binding/deployment remains blocked"
          fi

      - name: Allow Cloudflare API rate bucket to recover
        run: sleep 5

      - name: Probe console zone with bounded retry
        id: zone
        shell: bash
        run: |
          set -u
          HTTP_CODE=000
          for attempt in 1 2 3; do
            HTTP_CODE="$(curl --silent --show-error -o zone.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=tolanimediagroup.com&account.id=${CLOUDFLARE_ACCOUNT_ID}")"
            [ "${HTTP_CODE}" != "429" ] && break
            sleep $((attempt * 5))
          done
          AVAILABLE=false
          ZONE_ID=""
          if [ "${HTTP_CODE}" = "200" ]; then
            ZONE_ID="$(node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync("zone.json","utf8"));
              if(j.success && Array.isArray(j.result) && j.result.length===1) process.stdout.write(j.result[0].id || "");
            ')"
            [ -n "${ZONE_ID}" ] && AVAILABLE=true
          fi
          echo "available=${AVAILABLE}" >> "$GITHUB_OUTPUT"
          echo "zone_id=${ZONE_ID}" >> "$GITHUB_OUTPUT"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          if [ "${AVAILABLE}" != "true" ]; then
            echo "::warning::tolanimediagroup.com zone not proven available to this token (HTTP ${HTTP_CODE})"
          fi

      - name: Allow Cloudflare API rate bucket to recover again
        run: sleep 5

      - name: Probe Access management capability with bounded retry
        id: access
        shell: bash
        run: |
          set -u
          HTTP_CODE=000
          for attempt in 1 2 3; do
            HTTP_CODE="$(curl --silent --show-error -o access-apps.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps?per_page=1")"
            [ "${HTTP_CODE}" != "429" ] && break
            sleep $((attempt * 5))
          done
          AUTHORIZED=false
          [ "${HTTP_CODE}" = "200" ] && AUTHORIZED=true
          echo "authorized=${AUTHORIZED}" >> "$GITHUB_OUTPUT"
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          if [ "${AUTHORIZED}" != "true" ]; then
            echo "::warning::Access application management not proven (HTTP ${HTTP_CODE}); console activation remains blocked"
          fi

      - name: Write bootstrap evidence
        shell: bash
        env:
          D1_AUTHORIZED: ${{ steps.d1.outputs.authorized }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          D1_CREATED: ${{ steps.d1.outputs.created }}
          D1_HTTP_CODE: ${{ steps.d1.outputs.http_code }}
          ZONE_AVAILABLE: ${{ steps.zone.outputs.available }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          ZONE_HTTP_CODE: ${{ steps.zone.outputs.http_code }}
          ACCESS_AUTHORIZED: ${{ steps.access.outputs.authorized }}
          ACCESS_HTTP_CODE: ${{ steps.access.outputs.http_code }}
        run: |
          node -e '
            const fs=require("fs");
            fs.writeFileSync("intake-bootstrap-evidence.json", JSON.stringify({
              schemaVersion:"1.2.0",
              sha:process.env.BOOTSTRAP_SHA,
              database:{name:process.env.D1_NAME,id:process.env.D1_DATABASE_ID||null,authorized:process.env.D1_AUTHORIZED==="true",createdThisRun:process.env.D1_CREATED==="true",httpCode:Number(process.env.D1_HTTP_CODE||0),primaryLocationHint:"enam",readReplication:"disabled"},
              zone:{name:"tolanimediagroup.com",id:process.env.ZONE_ID||null,available:process.env.ZONE_AVAILABLE==="true",httpCode:Number(process.env.ZONE_HTTP_CODE||0)},
              access:{authorized:process.env.ACCESS_AUTHORIZED==="true",httpCode:Number(process.env.ACCESS_HTTP_CODE||0),policyModel:"cloudflare-account-members"},
              consoleHost:process.env.CONSOLE_HOST,
              customDomainAttached:false,
              workerDeployed:false,
              productionAuthority:false
            },null,2));
          '

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmg-intake-bootstrap-${{ github.run_id }}
          retention-days: 14
          path: intake-bootstrap-evidence.json

      - name: Enforce activation prerequisites
        shell: bash
        env:
          D1_AUTHORIZED: ${{ steps.d1.outputs.authorized }}
          ZONE_AVAILABLE: ${{ steps.zone.outputs.available }}
          ACCESS_AUTHORIZED: ${{ steps.access.outputs.authorized }}
        run: |
          set -euo pipefail
          [ "${D1_AUTHORIZED}" = "true" ] || { echo "::error::D1 permission is required"; exit 10; }
          [ "${ZONE_AVAILABLE}" = "true" ] || { echo "::error::tolanimediagroup.com Cloudflare zone is required"; exit 11; }
          [ "${ACCESS_AUTHORIZED}" = "true" ] || { echo "::error::Access Apps and Policies permission is required"; exit 12; }
