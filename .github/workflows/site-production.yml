name: Tolani Media Group Site Production

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/site.ts"
      - "wrangler.site.jsonc"
      - ".github/workflows/site-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmg-site-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'Tolani-Corp/TMG-video-services' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d20586cf099d39fcbeb5db4043e20f6f
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate public-site deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing from the production environment" >&2; exit 2; }
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const site = JSON.parse(fs.readFileSync("wrangler.site.jsonc", "utf8"));
          const service = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          if (site.name !== "tolani-media-group-site") throw new Error("Unexpected public-site Worker name");
          if (site.main !== "src/site.ts") throw new Error("Public site Worker entrypoint must be src/site.ts");
          if (site.assets?.directory !== "./site" || site.assets?.binding !== "ASSETS") {
            throw new Error("Public site must deploy ./site through the ASSETS binding");
          }
          const runWorkerFirst = site.assets?.run_worker_first ?? [];
          if (JSON.stringify(runWorkerFirst) !== JSON.stringify(["/status.json"])) {
            throw new Error("Only /status.json may run the public site Worker before assets");
          }
          if (site.workers_dev !== false) throw new Error("Public production site must not use workers.dev");
          const bindings = site.services ?? [];
          if (bindings.length !== 1 || bindings[0]?.binding !== "TMG_BACKEND" || bindings[0]?.service !== "tmg-video-services-production") {
            throw new Error("Public site must bind only to the private production backend Worker");
          }
          const routes = site.routes ?? [];
          const expected = new Set(["tolanimediagroup.com", "www.tolanimediagroup.com"]);
          if (routes.length !== 2) throw new Error("Public site must declare exactly two custom domains");
          for (const route of routes) {
            if (route.custom_domain !== true || !expected.delete(route.pattern)) {
              throw new Error(`Unexpected public-site route: ${JSON.stringify(route)}`);
            }
          }
          if (expected.size !== 0) throw new Error("Missing expected public-site custom domain");
          if (service.env?.production?.routes || service.env?.production?.route || service.env?.production?.custom_domains) {
            throw new Error("Governed video-services production Worker must remain unrouted");
          }
          for (const flag of ["TMG_PUBLIC_API_ENABLED", "TMG_MCP_ENABLED", "TMG_INGEST_WORKFLOW_ENABLED", "TMG_EXTERNAL_PROVIDER_EGRESS_ENABLED"]) {
            if (service.env?.production?.vars?.[flag] !== "false") throw new Error(`${flag} must remain false`);
          }
          NODE

      - name: Compile site deployment
        run: pnpm exec wrangler deploy --config wrangler.site.jsonc --dry-run --outdir .site-dry-run

      - name: Verify target backend Worker is registered
        run: pnpm exec wrangler deployments status --name tmg-video-services-production --json > backend-worker-registration.json

      - name: Deploy public site, service binding, and custom domains
        run: pnpm exec wrangler deploy --config wrangler.site.jsonc

      - name: Verify both Workers are registered
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments status --name tolani-media-group-site --json > site-worker-registration.json
          pnpm exec wrangler deployments status --name tmg-video-services-production --json > backend-worker-registration-post.json
          test -s site-worker-registration.json
          test -s backend-worker-registration-post.json

      - name: Verify browser sync and backend isolation
        shell: bash
        run: |
          set -euo pipefail
          for host in tolanimediagroup.com www.tolanimediagroup.com; do
            ok="false"
            for attempt in 1 2 3 4 5 6; do
              if body="$(curl --fail --silent --show-error --max-time 15 "https://${host}/")"; then
                printf '%s' "$body" | grep -Fq "Tolani Media Group" || { echo "Unexpected homepage content on ${host}" >&2; exit 3; }
                printf '%s' "$body" | grep -Fq "/app.js" || { echo "Browser sync script missing on ${host}" >&2; exit 3; }
                ok="true"
                break
              fi
              sleep 5
            done
            test "$ok" = "true" || { echo "Site did not become reachable on ${host}" >&2; exit 3; }
          done

          status_ok="false"
          status_body=""
          status_code="000"
          for attempt in 1 2 3 4 5 6 7 8; do
            response_file="$(mktemp)"
            status_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --max-time 15 "https://tolanimediagroup.com/status.json" || true)"
            status_body="$(cat "$response_file")"
            rm -f "$response_file"
            if [ "$status_code" = "200" ]; then
              status_ok="true"
              break
            fi
            echo "status.json attempt ${attempt} returned HTTP ${status_code}; waiting for Worker/Service Binding propagation"
            sleep 5
          done
          if [ "$status_ok" != "true" ]; then
            echo "status.json never became healthy; final HTTP ${status_code}" >&2
            printf '%s\n' "$status_body" >&2
            exit 5
          fi

          STATUS_BODY="$status_body" node --input-type=module - <<'NODE'
          const status = JSON.parse(process.env.STATUS_BODY ?? "{}");
          const failures = [];
          if (status.schema !== "tmg.public-status.v1") failures.push("status schema mismatch");
          if (status.site?.worker !== "tolani-media-group-site" || status.site?.status !== "ok") failures.push("public site Worker not synchronized");
          if (status.backend?.worker !== "tmg-video-services-production" || status.backend?.status !== "reachable") failures.push("private backend Worker is not reachable through Service Binding");
          if (status.backend?.publicStatusGate !== "G0") failures.push("unexpected public product gate");
          if (!["ui-bootstrap-v1", "health-v1"].includes(status.backend?.syncContract)) failures.push("unsupported backend sync contract");
          for (const flag of ["publicApiEnabled", "mcpEnabled"]) {
            if (status.runtime?.[flag] !== false) failures.push(`${flag} unexpectedly enabled`);
          }
          if (status.backend?.syncContract === "ui-bootstrap-v1") {
            for (const flag of ["ingestWorkflowEnabled", "externalProviderEgressEnabled"]) {
              if (status.runtime?.[flag] !== false) failures.push(`${flag} unexpectedly enabled`);
            }
            for (const flag of ["activationAuthorized", "publicApiAuthorized", "mcpAuthorized", "ingestionAuthorized", "externalProviderEgressAuthorized", "commercialUseAuthorized"]) {
              if (status.release?.[flag] !== false) failures.push(`${flag} unexpectedly authorized`);
            }
          } else {
            if (status.runtime?.ingestWorkflowEnabled !== null) failures.push("health-v1 must not invent ingestion runtime state");
            if (status.runtime?.externalProviderEgressEnabled !== null) failures.push("health-v1 must not invent provider-egress runtime state");
            if (status.release !== null) failures.push("health-v1 must not invent release-authority state");
          }
          if (failures.length) throw new Error(failures.join("; "));
          console.log(JSON.stringify({
            schema: status.schema,
            siteWorker: status.site.worker,
            backendWorker: status.backend.worker,
            backendStatus: status.backend.status,
            syncContract: status.backend.syncContract,
            publicStatusGate: status.backend.publicStatusGate,
            policyVersion: status.backend.policyVersion,
            synchronizedAt: status.synchronizedAt,
          }, null, 2));
          NODE

          for path in /v1/search /mcp /health; do
            http_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "https://tolanimediagroup.com${path}")"
            case "$http_status" in
              404) ;;
              *) echo "Public site unexpectedly exposed ${path} with HTTP ${http_status}" >&2; exit 4 ;;
            esac
          done
