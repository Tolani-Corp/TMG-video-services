name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      QUALITY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Tolani platform naming contract
        run: pnpm platform-naming-policy:check
      - name: Generate Cloudflare binding types
        run: pnpm cf-typegen
      - name: Validate protected review deployment bundle
        run: |
          docker version >/dev/null
          pnpm exec wrangler deploy --config wrangler.review.jsonc --dry-run --outdir .review-dry-run
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Tolani commercial-context integrity
        run: pnpm marketing:check
      - name: Publish required Quality status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${QUALITY_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"Quality / validate\",\"description\":\"Quality validation passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
      - name: Publish required Quality failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${QUALITY_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"Quality / validate\",\"description\":\"Quality validation failed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
