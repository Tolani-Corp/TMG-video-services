name: TMG Intake Console Activation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/intake-console-activation.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: tmg-intake-console-activation
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feat/authenticated-intake-job-control-v1' }}
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d20586cf099d39fcbeb5db4043e20f6f
      ACTIVATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TMG_CONTROL_DB_NAME: tmg-video-control-dev
      TMG_CONSOLE_ZONE: tolanimediagroup.com
      TMG_CONSOLE_HOST: console.tolanimediagroup.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVATION_SHA }}

      - name: Verify credential contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing development CLOUDFLARE_API_TOKEN"; exit 2; }

      - name: Wait for exact-head Quality success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${ACTIVATION_SHA}/status" \
              > exact-head-status.json

            STATE="$(node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync("exact-head-status.json","utf8"));
              const s=(j.statuses||[]).find((x)=>x.context==="Quality / validate");
              process.stdout.write(s?.state || "missing");
            ')"
            echo "Quality / validate state: ${STATE} (attempt ${attempt})"
            case "${STATE}" in
              success) break ;;
              failure|error) echo "::error::Exact-head Quality failed"; exit 3 ;;
              *) sleep 5 ;;
            esac
            if [ "${attempt}" = "60" ]; then
              echo "::error::Timed out waiting for exact-head Quality success"
              exit 4
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install exact-head dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare D1, zone, and Access before domain attachment
        id: prepare
        run: node scripts/prepare-intake-cloudflare-activation.mjs

      - name: Render activation-only Wrangler configs
        env:
          TMG_CONTROL_DB_ID: ${{ steps.prepare.outputs.database_id }}
          TMG_CONSOLE_ZONE_ID: ${{ steps.prepare.outputs.zone_id }}
        run: |
          set -euo pipefail
          node scripts/render-intake-activation-config.mjs | tee intake-activation-config.json
          ! grep -R "00000000-0000-0000-0000-000000000000" .wrangler/intake-activation

      - name: Apply D1 intake migration with backup/rollback semantics
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply "${TMG_CONTROL_DB_NAME}" \
            --remote \
            --config .wrangler/intake-activation/api.jsonc \
            | tee d1-migrations.txt

      - name: Deploy Access-protected UI origin and attach console Custom Domain
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy \
            --config .wrangler/intake-activation/ui.jsonc \
            | tee ui-deploy.txt

      - name: Deploy more-specific authenticated console API routes
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy \
            --config .wrangler/intake-activation/api.jsonc \
            | tee api-deploy.txt

      - name: Prove unauthenticated console denial
        id: unauth
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            local prefix="$2"
            local status="000"
            local location=""
            for attempt in $(seq 1 30); do
              rm -f "${prefix}.headers"
              status="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
                -D "${prefix}.headers" -o /dev/null -w '%{http_code}' "${url}" || true)"
              status="${status:-000}"
              location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "${prefix}.headers" 2>/dev/null || true)"
              echo "${url} -> ${status} ${location}"
              if [ "${status}" = "200" ]; then
                echo "::error::Unauthenticated request reached protected console with HTTP 200"
                return 20
              fi
              case "${status}" in
                301|302|303|307|308)
                  echo "${location}" | grep -q "/cdn-cgi/access/" || {
                    echo "::error::Redirect did not originate from Cloudflare Access: ${location}"
                    return 21
                  }
                  break
                  ;;
                401|403) break ;;
                *) sleep 5 ;;
              esac
              if [ "${attempt}" = "30" ]; then
                echo "::error::Console did not reach a stable Access denial state"
                return 22
              fi
            done
            printf '%s' "${status}"
          }

          HOME_STATUS="$(probe "https://${TMG_CONSOLE_HOST}/" "unauth-home")"
          API_STATUS="$(probe "https://${TMG_CONSOLE_HOST}/v1/console/session" "unauth-api")"
          echo "home_status=${HOME_STATUS}" >> "$GITHUB_OUTPUT"
          echo "api_status=${API_STATUS}" >> "$GITHUB_OUTPUT"

      - name: Execute final local two-identity rights-first acceptance
        run: pnpm intake:local-e2e | tee intake-local-e2e.txt

      - name: Write activation evidence
        env:
          D1_DATABASE_ID: ${{ steps.prepare.outputs.database_id }}
          ZONE_ID: ${{ steps.prepare.outputs.zone_id }}
          ACCESS_APP_ID: ${{ steps.prepare.outputs.access_app_id }}
          ACCESS_POLICY_ID: ${{ steps.prepare.outputs.access_policy_id }}
          UNAUTH_HOME_STATUS: ${{ steps.unauth.outputs.home_status }}
          UNAUTH_API_STATUS: ${{ steps.unauth.outputs.api_status }}
        run: |
          node -e '
            const fs=require("fs");
            const prep=JSON.parse(fs.readFileSync("intake-cloudflare-preparation.json","utf8"));
            fs.writeFileSync("intake-console-activation-evidence.json", JSON.stringify({
              schema:"tmg.intake-console-activation-evidence.v1",
              sha:process.env.ACTIVATION_SHA,
              generatedAt:new Date().toISOString(),
              consoleHost:process.env.TMG_CONSOLE_HOST,
              database:{name:process.env.TMG_CONTROL_DB_NAME,id:process.env.D1_DATABASE_ID,migration:"0001_intake_control_plane.sql",applied:true},
              zone:{name:process.env.TMG_CONSOLE_ZONE,id:process.env.ZONE_ID},
              access:{applicationId:process.env.ACCESS_APP_ID,policyId:process.env.ACCESS_POLICY_ID,allowedPopulation:"cloudflare-account-members-only",createdBeforeDomainAttachment:prep.accessCreatedBeforeDomainAttachment===true},
              deployment:{uiWorker:"tmg-video-services",apiWorker:"tmg-video-intake-api-dev",customDomainAttached:true,apiRoutesAttached:true},
              unauthenticatedDenial:{homeStatus:Number(process.env.UNAUTH_HOME_STATUS||0),apiStatus:Number(process.env.UNAUTH_API_STATUS||0),passed:true},
              localAcceptance:{twoIdentityRightsFirst:true,selfReviewDenied:true,preRightsSourceUploadDenied:true,processingAuthority:false,workflowDispatched:false,billable:false,passed:true},
              authority:{publicApi:false,mcp:false,ingestionWorkflow:false,externalProviderEgress:false,publication:false,commercial:false,productionProcessing:false},
              prMustRemainDraft:true
            },null,2));
          '

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmg-intake-console-activation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            intake-cloudflare-preparation.json
            intake-activation-config.json
            d1-migrations.txt
            ui-deploy.txt
            api-deploy.txt
            unauth-home.headers
            unauth-api.headers
            intake-local-e2e.txt
            intake-console-activation-evidence.json

      - name: Publish activation success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${ACTIVATION_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"TMG Intake Console Activation\",\"description\":\"D1 + Access + console + local rights-first acceptance passed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Publish activation HOLD status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${ACTIVATION_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"TMG Intake Console Activation\",\"description\":\"HOLD: inspect activation evidence; no authority promotion\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
