name: TMG Storyboard Brand Composition Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/storyboard-brand-composition-v1-1
    paths:
      - .github/workflows/storyboard-brand-composition-acceptance.yml
      - src/storyboard-brand-composition.ts
      - src/storyboard-brand-workflow.ts
      - scripts/render-storyboard-brand-acceptance-config.mjs
      - scripts/prepare-storyboard-brand-acceptance.mjs
      - scripts/prepare-storyboard-brand-cleanup-index.mjs
      - scripts/index-storyboard-brand-artifacts.mjs
      - scripts/render-storyboard-brand-motion-preview.mjs
      - scripts/verify-storyboard-brand-acceptance.mjs
      - tests/storyboard-brand-composition.test.ts
      - docs/STORYBOARD_BRAND_COMPOSITION_V1_1.md
      - src/image-runtime.ts
      - src/marketing-creative.ts
      - src/marketing-storyboard.ts

permissions:
  contents: read
  statuses: write

concurrency:
  group: tmg-storyboard-brand-v1-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d20586cf099d39fcbeb5db4043e20f6f
      ACCEPTANCE_SHA: ${{ github.sha }}
      TMG_STORYBOARD_BRAND_ACCEPT_WORKER: tmg-storyboard-brand-${{ github.run_id }}
      TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET: tmg-storyboard-brand-${{ github.run_id }}
      TMG_STORYBOARD_BRAND_ACCEPT_WORKFLOW: tmg-storyboard-brand-${{ github.run_id }}
      TMG_STORYBOARD_BRAND_ACCEPT_REQUEST_ID: storyboard-brand-${{ github.run_id }}
      TMG_STORYBOARD_BRAND_ACCEPT_INSTANCE_ID: storyboard-brand-instance-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTANCE_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Mark storyboard brand acceptance pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${ACCEPTANCE_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"TMG Storyboard Brand v1.1 / acceptance\",\"description\":\"Multi-shot FLUX + exact brand composition canary running\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Verify isolated-canary secret is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN in development environment"; exit 2; }

      - name: Validate exact head and prepare governed fixtures
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          pnpm install --no-frozen-lockfile
          pnpm cf-typegen
          pnpm typecheck
          pnpm test
          pnpm marketing:check
          node scripts/render-storyboard-brand-acceptance-config.mjs
          node scripts/prepare-storyboard-brand-acceptance.mjs
          node scripts/prepare-storyboard-brand-cleanup-index.mjs

      - name: Provision and seed isolated private R2
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler r2 bucket create "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}"
          touch .storyboard-brand-r2-created
          node - <<'NODE' > storyboard-brand-seed-index.tsv
          const x = JSON.parse(require("fs").readFileSync("storyboard-brand-fixture-index.json", "utf8"));
          console.log(`${x.files.source.fileName}\t${x.files.source.objectKey}`);
          console.log(`${x.files.logo.fileName}\t${x.files.logo.objectKey}`);
          for (const item of x.files.derivatives) console.log(`${item.fileName}\t${item.objectKey}`);
          NODE
          while IFS=$'\t' read -r file key; do
            pnpm exec wrangler r2 object put "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${key}" \
              --file "${file}" --content-type image/webp --remote --config .wrangler.storyboard-brand.acceptance.json
          done < storyboard-brand-seed-index.tsv
          SOURCE_MANIFEST_KEY="$(node -p 'JSON.parse(require("fs").readFileSync("storyboard-brand-fixture-index.json","utf8")).sourceManifestKey')"
          CREATIVE_BRIEF_KEY="$(node -p 'JSON.parse(require("fs").readFileSync("storyboard-brand-fixture-index.json","utf8")).creativeBriefKey')"
          pnpm exec wrangler r2 object put "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${SOURCE_MANIFEST_KEY}" \
            --file storyboard-brand-image-manifest.json --content-type application/json --remote --config .wrangler.storyboard-brand.acceptance.json
          pnpm exec wrangler r2 object put "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${CREATIVE_BRIEF_KEY}" \
            --file storyboard-brand-creative-brief.json --content-type application/json --remote --config .wrangler.storyboard-brand.acceptance.json

      - name: Deploy isolated storyboard brand Worker and Workflow
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config .wrangler.storyboard-brand.acceptance.json 2>&1 | tee storyboard-brand-deploy.log
          touch .storyboard-brand-worker-deployed
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' storyboard-brand-deploy.log | tail -1)"
          test -n "${WORKER_URL}" || { echo "::error::Could not resolve storyboard brand Worker URL"; exit 4; }
          echo "worker_url=${WORKER_URL}" >> "$GITHUB_OUTPUT"

      - name: Prove isolated renderer surface is reachable
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output storyboard-brand-health.json --write-out '%{http_code}' "${{ steps.deploy.outputs.worker_url }}/" || true)"
            if [ "${status}" = "200" ] && grep -q 'tmg-storyboard-brand-composition' storyboard-brand-health.json && grep -q '"pVideoExecutionAuthorized":false' storyboard-brand-health.json; then
              ready=true
              break
            fi
            sleep 2
          done
          test "${ready}" = true || { cat storyboard-brand-health.json || true; echo "::error::Storyboard brand renderer did not become ready"; exit 5; }

      - name: Trigger governed multi-shot storyboard workflow
        shell: bash
        run: |
          set -euo pipefail
          PARAMS="$(node -p 'JSON.stringify(JSON.parse(require("fs").readFileSync("storyboard-brand-request.json","utf8")))')"
          pnpm exec wrangler workflows trigger "${TMG_STORYBOARD_BRAND_ACCEPT_WORKFLOW}" "${PARAMS}" \
            --id "${TMG_STORYBOARD_BRAND_ACCEPT_INSTANCE_ID}" \
            --config .wrangler.storyboard-brand.acceptance.json

      - name: Wait for top-level storyboard workflow terminal state
        shell: bash
        run: |
          set -euo pipefail
          completed=false
          for attempt in $(seq 1 240); do
            pnpm exec wrangler workflows instances describe "${TMG_STORYBOARD_BRAND_ACCEPT_WORKFLOW}" "${TMG_STORYBOARD_BRAND_ACCEPT_INSTANCE_ID}" \
              --config .wrangler.storyboard-brand.acceptance.json > storyboard-brand-workflow.txt 2>&1 || true
            STATUS="$(sed -n 's/^Status:[[:space:]]*//p' storyboard-brand-workflow.txt | head -1)"
            case "${STATUS}" in
              *Complete*|*Completed*|*Success*) completed=true; break ;;
              *Errored*|*Terminated*|*Failed*) cat storyboard-brand-workflow.txt; exit 6 ;;
            esac
            sleep 3
          done
          test "${completed}" = true || { cat storyboard-brand-workflow.txt; echo "::error::Storyboard brand workflow did not complete in bounded window"; exit 7; }
          cat storyboard-brand-workflow.txt

      - name: Retrieve immutable manifests and all generated/composed assets
        shell: bash
        run: |
          set -euo pipefail
          TENANT_ID="$(node -p 'JSON.parse(require("fs").readFileSync("storyboard-brand-request.json","utf8")).tenantId')"
          REQUEST_ID="${TMG_STORYBOARD_BRAND_ACCEPT_REQUEST_ID}"
          ROOT="tenants/${TENANT_ID}/production-requests/${REQUEST_ID}/outputs/marketing/storyboard-brand-v1-1"
          ENHANCED_KEY="tenants/${TENANT_ID}/image-runtime/${REQUEST_ID}/control/image-asset-manifest-v1.1.json"
          pnpm exec wrangler r2 object get "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${ENHANCED_KEY}" \
            --file storyboard-brand-enhanced-image-manifest.json --remote --config .wrangler.storyboard-brand.acceptance.json
          pnpm exec wrangler r2 object get "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${ROOT}/control/storyboard-manifest-v1.1.json" \
            --file storyboard-brand-manifest.json --remote --config .wrangler.storyboard-brand.acceptance.json
          pnpm exec wrangler r2 object get "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${ROOT}/handoff/video-render-plan-v1.json" \
            --file storyboard-brand-video-render-plan.json --remote --config .wrangler.storyboard-brand.acceptance.json
          pnpm exec wrangler r2 object get "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${ROOT}/review/storyboard-brand-review-package-v1.1.json" \
            --file storyboard-brand-review-package.json --remote --config .wrangler.storyboard-brand.acceptance.json
          node scripts/index-storyboard-brand-artifacts.mjs
          while IFS=$'\t' read -r local_file object_key; do
            pnpm exec wrangler r2 object get "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${object_key}" \
              --file "${local_file}" --remote --config .wrangler.storyboard-brand.acceptance.json
          done < storyboard-brand-retrieval-index.tsv

      - name: Compile target-specific deterministic multi-shot motion mockups
        shell: bash
        run: node scripts/render-storyboard-brand-motion-preview.mjs

      - name: Verify provenance, exact composition, render handoff, and motion evidence
        shell: bash
        run: node scripts/verify-storyboard-brand-acceptance.mjs

      - name: Capture Workflow evidence
        if: always()
        shell: bash
        run: |
          set +e
          pnpm exec wrangler workflows instances describe "${TMG_STORYBOARD_BRAND_ACCEPT_WORKFLOW}" "${TMG_STORYBOARD_BRAND_ACCEPT_INSTANCE_ID}" \
            --config .wrangler.storyboard-brand.acceptance.json > storyboard-brand-workflow.txt 2>&1 || true

      - name: Upload sanitized storyboard brand acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmg-storyboard-brand-v1-1-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            storyboard-brand-request.json
            storyboard-brand-image-manifest.json
            storyboard-brand-creative-brief.json
            storyboard-brand-enhanced-image-manifest.json
            storyboard-brand-manifest.json
            storyboard-brand-video-render-plan.json
            storyboard-brand-review-package.json
            storyboard-brand-motion-preview-evidence.json
            storyboard-brand-acceptance-evidence.json
            storyboard-brand-retrieval-index.json
            storyboard-brand-workflow.txt
            storyboard-brand-generated-*.bin
            storyboard-brand-composed-*.webp
            storyboard-brand-title-*.webp
            storyboard-brand-end-*.webp
            storyboard-brand-preview-*.mp4

      - name: Remove isolated storyboard brand Worker
        if: always()
        shell: bash
        run: |
          set +e
          rc=0
          if [ -f .storyboard-brand-worker-deployed ]; then
            pnpm exec wrangler delete --name "${TMG_STORYBOARD_BRAND_ACCEPT_WORKER}" --config .wrangler.storyboard-brand.acceptance.json || rc=1
          fi
          exit "${rc}"

      - name: Remove all isolated R2 objects and bucket
        if: always()
        shell: bash
        run: |
          set +e
          rc=0
          if [ ! -f .storyboard-brand-r2-created ]; then exit 0; fi
          if [ -f storyboard-brand-cleanup-index.txt ]; then
            while IFS= read -r key; do
              [ -n "${key}" ] || continue
              pnpm exec wrangler r2 object delete "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}/${key}" \
                --remote --config .wrangler.storyboard-brand.acceptance.json >/dev/null 2>&1 || rc=1
            done < storyboard-brand-cleanup-index.txt
          fi
          pnpm exec wrangler r2 bucket delete "${TMG_STORYBOARD_BRAND_ACCEPT_R2_BUCKET}" >/dev/null 2>&1 || rc=1
          exit "${rc}"

      - name: Mark storyboard brand acceptance success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${ACCEPTANCE_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"TMG Storyboard Brand v1.1 / acceptance\",\"description\":\"10 FLUX shots + exact brand composition + render handoff verified\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Mark storyboard brand acceptance failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${ACCEPTANCE_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"TMG Storyboard Brand v1.1 / acceptance\",\"description\":\"Storyboard brand canary failed; inspect evidence\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
